<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RozgarSathi</title>

  <!-- Icons -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#e9e9e9;
    }

    /* Top Black Bar */
    .top-bar{
      background:black;
      color:white;
      text-align:center;
      padding:12px;
      font-size:28px;
      font-weight:bold;
    }

    /* Main Navbar */
    .navbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:25px 40px;
      background:#efefef;
    }

    /* Logo Box */
    .logo-box{
      display:flex;
      align-items:center;
      gap:18px;
      border:1px solid black;
      padding:22px 28px;
      background:white;
    }

    .logo-box i{
      font-size:38px;
    }

    .logo-text{
      font-size:24px;
      font-weight:bold;
    }

    /* Right Icons */
    .nav-icons{
      display:flex;
      gap:18px;
    }

    .icon-circle{
      width:68px;
      height:68px;
      border:3px solid black;
      border-radius:50%;
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:34px;
      cursor:pointer;
      background:white;
    }

    .icon-circle:hover{
      background:black;
      color:white;
      transition:0.3s;
    }

  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="top-bar">
    RozgarSathi
  </div>

  <!-- Navbar -->
  <div class="navbar">

    <!-- Logo -->
    <div class="logo-box">
      <i class="fa-solid fa-user-tie"></i>
      <div class="logo-text">RozgarSathi</div>
    </div>

    <!-- Icons -->
    <div class="nav-icons">

      <div class="icon-circle">
        <i class="fa-solid fa-cart-shopping"></i>
      </div>

      <div class="icon-circle">
        <i class="fa-regular fa-user"></i>
      </div>

      <div class="icon-circle">
        <i class="fa-solid fa-bars"></i>
      </div>

    </div>

  </div>

</body>
</html>
